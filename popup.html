<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 320px; font-family: sans-serif; padding: 15px; margin: 0; }
        h3 { color: #2271b1; margin-top: 0; }
        .queue-status { background: #f6faf0; border-left: 4px solid #96BE2D; padding: 10px; margin-bottom: 15px; font-size: 13px; }
        .btn { width: 100%; padding: 10px; margin-bottom: 8px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-export { background: #2271b1; color: white; }
        .btn-clear { background: #f0f0f0; color: #555; }
        .btn-settings { background: none; color: #2271b1; text-decoration: underline; margin-top: 10px; padding: 0; }
    </style>
</head>
<body>
    <h3>🦜 Polly Alt Queue</h3>
    <div class="queue-status" id="queue-count">Loading...</div>
    
    <button class="btn btn-export" id="export-btn">📥 Export to Text File</button>
    <button class="btn btn-clear" id="clear-btn">🗑️ Clear Queue</button>
    <button class="btn btn-settings" id="settings-btn">⚙️ Open Settings</button>

    <script src="popup.js"></script>
</body>
</html>
